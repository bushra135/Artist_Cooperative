<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — Artisan</title>
<meta name="description" content="Log in to Artisan.">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html">Arti<span>san</span></a>
    <a href="index.html" class="btn btn-ghost btn-sm">← Back to site</a>
  </div>
</header>
<main class="auth-main">

<div class="auth-card">
  <h1>Welcome back</h1>
  <p class="sub">Log in to your Artisan account.</p>
  <div class="tabs">
    <a href="login.html" class="active">Log in</a>
    <a href="signup.html">Sign up</a>
  </div>
  <button class="social-btn">🔵 Continue with Google</button>
  <div class="divider">or</div>
  <div class="field"><label>Email</label><input class="input" type="email" placeholder="you@example.com"></div>
  <div class="field"><label>Password</label><input class="input" type="password" placeholder="••••••••"></div>
  <div style="text-align:right;margin-bottom:16px"><a href="forgot-password.html" style="font-size:13px">Forgot password?</a></div>
  <button class="btn btn-accent btn-block btn-lg">Log in</button>
  <p class="auth-foot">Don't have an account? <a href="signup.html">Sign up</a></p>
</div>

</main>
</body>
</html>
